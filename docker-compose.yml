services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_WEB_PORT:-5670}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - quality-gateway

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_quality_platform}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_GATEWAY_ORIGIN: same-origin
    depends_on:
      - quality-gateway
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_ORIGIN: same-origin

  quality-gateway:
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: quality-gateway
    environment:
      NODE_ENV: production
      QTP_RUNTIME_ENV: production
      PLATFORM_SERVICE_HOST: quality-platform-service
      EXECUTION_SERVICE_HOST: quality-execution-service
      AI_INVOCATION_SERVICE_HOST: quality-ai-invocation-service
      QTP_AUTH_TOKEN_SECRET: ${QTP_AUTH_TOKEN_SECRET:?QTP_AUTH_TOKEN_SECRET is required}
    depends_on:
      - quality-platform-service
      - quality-execution-service
      - quality-ai-invocation-service

  quality-platform-service:
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: quality-platform-service
    environment: &service-env
      NODE_ENV: production
      QTP_RUNTIME_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-ai_quality_platform}
      AI_INVOCATION_SERVICE_HOST: quality-ai-invocation-service
      QTP_AUTH_TOKEN_SECRET: ${QTP_AUTH_TOKEN_SECRET:?QTP_AUTH_TOKEN_SECRET is required}
      QTP_ALLOWED_APP_INVOKE_ORIGINS: ${QTP_ALLOWED_APP_INVOKE_ORIGINS:-}
    depends_on:
      - mysql
      - quality-ai-invocation-service

  quality-execution-service:
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: quality-execution-service
    environment: *service-env
    depends_on:
      - mysql
      - quality-ai-invocation-service

  quality-ai-invocation-service:
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: quality-ai-invocation-service
    environment:
      NODE_ENV: production
      QTP_RUNTIME_ENV: production
