services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_WEB_PORT:-5670}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - quality-gateway

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_quality_platform
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "sunsharing"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sunsharing", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_GATEWAY_ORIGIN: same-origin
    depends_on:
      - quality-gateway
    environment:
      NEXT_PUBLIC_GATEWAY_ORIGIN: same-origin

  quality-gateway:
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: quality-gateway
    environment:
      PLATFORM_SERVICE_HOST: quality-platform-service
      EXECUTION_SERVICE_HOST: quality-execution-service
    depends_on:
      - quality-platform-service
      - quality-execution-service

  quality-platform-service:
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: quality-platform-service
    environment: &service-env
      DATABASE_URL: mysql://root:root@mysql:3306/ai_quality_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: sunsharing
    depends_on:
      - mysql
      - redis

  quality-execution-service:
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: quality-execution-service
    environment: *service-env
    depends_on:
      - mysql
      - redis
